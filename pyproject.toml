[project]
name = "student-portal"
version = "0.1.0"
description = "Система управління студентами"
readme = "README.md"
authors = [
    { name = "Бондарчук Валерія", email = "62139768+lerabo@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
]

[project.scripts]
student-portal = "student_portal:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.15",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pep8-naming, pyupgrade, bugbear, simplify
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501"]

[tool.mypy]
strict = true

[tool.pytest]
minversion = "9.0"
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = ["-ra"]
strict = true

[tool.coverage.run]
branch = true
source = ["student_portal", "students"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
