{% extends "base.html" %}

{% block title %}{{ block.super }}: оцінка {{ letter }}{% endblock %}

{% block content %}
<h1>Середній бал за шкалою ECTS: {{ letter }}</h1>
<ul>
  {% for student in students %}
    <li><a href="{% url 'students:detail' student.id %}">{{ student.full_name }}</a></li>
  {% empty %}
    <li>Таких студентів немає</li>
  {% endfor %}
</ul>
{% endblock %}
