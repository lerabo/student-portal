{% load static %}
<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{% static 'students/style.css' %}">
  <title>{% block title %}Система управління студентами{% endblock %}</title>
</head>
<body>
  <nav>
    <a href="{% url 'students:list' %}">Студенти</a>
    <a href="{% url 'students:ranking' %}">Рейтинг</a>
    {% if user.is_authenticated %}
      <span class="user">{{ user.get_username }}</span>
      <form method="post" action="{% url 'logout' %}" class="logout">
        {% csrf_token %}
        <button type="submit">Вийти</button>
      </form>
    {% endif %}
  </nav>
  <main>
    {% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
